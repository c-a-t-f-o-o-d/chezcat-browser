<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; script-src 'unsafe-inline'">
<link rel="stylesheet" href="styles/theme.css"><title>C1 geometry pending</title>
</head><body>
<div id="target"></div>
<img id="control" src="images/control.ppm" width="4" height="4" alt="Original image control">
<p id="state">Original external CSS background fixture</p>
<script>
window.onload=function(){
 var target=document.getElementById('target'),control=document.getElementById('control');
 if(target.clientWidth!==32||target.clientHeight!==24||control.clientWidth!==4||control.clientHeight!==4)throw Error('Original CSS/image geometry changed');
 document.getElementById('state').textContent='Geometry target32x24 control4x4';
 document.title='C1 geometry 32x24 / 4x4';
};
</script></body></html>
