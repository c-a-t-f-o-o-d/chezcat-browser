<!-- Original local fixture. Only loopback resources; no access-check code. -->
<p id="event-namespace-state">Fixture pending</p>
<div id="geometry-state" style="width:40px;height:20px;padding:3px 5px;border:2px solid black"></div>
<div id="fragment-fixture"><p id="fragment-old" title="retained">Old fragment</p></div>
<p id="history-state">History pending</p>
<script>
var fixtureNode=document.getElementById('event-namespace-state');
if(history!==window.history||history.state!==null||history.replaceState.length!==2)throw Error('real History surface');
var fixtureHistoryURL=location.pathname+location.search+'#fixture';
history.replaceState(history.state,'',fixtureHistoryURL);
if(location.href!==location.origin+fixtureHistoryURL||document.URL!==location.href)throw Error('synchronous History rewrite');
document.getElementById('history-state').textContent='History entry ready';
fixtureNode.setAttribute('data-sample','value');
if(fixtureNode.getAttributeNS(null,'data-sample')!=='value'||fixtureNode.getAttributeNS('urn:fixture','data-sample')!==null)throw Error('namespace read');
fixtureNode.setAttributeNS('urn:fixture','a:sample','first');
var fixtureAttr=fixtureNode.getAttributeNodeNS('urn:fixture','sample');
fixtureNode.setAttributeNS('urn:fixture','b:sample','second');
if(fixtureAttr!==fixtureNode.getAttributeNodeNS('urn:fixture','sample')||fixtureAttr.name!=='a:sample'||fixtureAttr.value!=='second'||fixtureAttr.namespaceURI!=='urn:fixture')throw Error('namespace mutation identity');
fixtureNode.removeAttributeNS('urn:fixture','sample');
if(fixtureAttr.ownerElement!==null||fixtureAttr.value!=='second')throw Error('namespace detachment');
var fixtureMap=fixtureNode.attributes;
if(fixtureMap!==fixtureNode.attributes||fixtureMap.getNamedItem('data-sample')!==fixtureNode.getAttributeNode('data-sample')||fixtureMap.item(0)!==fixtureMap[0])throw Error('live attribute map');
var geometryNode=document.getElementById('geometry-state'),geometryRect=geometryNode.getBoundingClientRect();
if(!(geometryRect instanceof DOMRect)||geometryRect.width!==54||geometryRect.height!==30||geometryRect===geometryNode.getBoundingClientRect())throw Error('real renderer DOMRect');
geometryNode.style.width='60px';
if(geometryNode.getBoundingClientRect().width!==74||geometryRect.width!==54)throw Error('layout refresh and snapshot stability');
var fragmentNode=document.getElementById('fragment-fixture'),fragmentOld=document.getElementById('fragment-old'),fragmentAttr=fragmentOld.getAttributeNode('title');
fragmentNode.innerHTML='<p id="fragment-state">Fragment waiting</p><img id="fragment-image" src="/fixture-image.ppm"><script id="fragment-inert" src="/fixture-inert.js">window.fragmentExecuted=true;<\/script>';
if(fragmentOld.parentNode!==null||fragmentOld.isConnected||fragmentAttr.ownerElement!==fragmentOld||fragmentAttr.value!=='retained'||document.getElementById('fragment-old')!==null||fragmentNode.innerHTML.indexOf('<img id="fragment-image"')<0)throw Error('fragment replacement and retained identity');
var fragmentImage=document.getElementById('fragment-image');
fragmentImage.onload=function(){
 if(!fragmentImage.complete||fragmentImage.naturalWidth!==2||fragmentImage.naturalHeight!==1||fragmentImage.getBoundingClientRect().width!==2||window.fragmentExecuted!==undefined)throw Error('real fragment image completion');
 document.getElementById('fragment-state').textContent='Fragment image loaded';
};
fragmentImage.onerror=function(){throw Error('loopback fragment image failed');};
var fixtureEvent=document.createEvent('UIEvents');
fixtureEvent.initUIEvent('fixture',true,true,window,4294967297);
if(fixtureEvent.view!==window||fixtureEvent.detail!==1||fixtureEvent.isTrusted)throw Error('UI initializer');
var fixtureError='';try{fixtureNode.setAttribute('data bad','x');}catch(e){fixtureError=e.name;}
if(fixtureError!=='InvalidCharacterError')throw Error('attribute exception');
var fixtureOrder='';
Promise.resolve().then(function(){try{fixtureNode.removeChild(document.createElement('span'));}catch(e){fixtureOrder=e.name;}});
Promise.resolve().then(function(){if(fixtureOrder!=='NotFoundError')throw Error('Promise exception');fixtureNode.textContent='Event namespace ready';});
document.addEventListener('keydown',function(event){
 if(event.view!==window||event.detail!==0||!event.isTrusted)throw Error('native UI fields');
 var type=event.type;
 event.initUIEvent('unchanged',false,false,null,7);
 if(event.type!==type||event.detail!==0||!event.isTrusted)throw Error('native initializer isolation');
 fixtureNode.textContent='Native UI observed';
});
</script>
