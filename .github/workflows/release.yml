name: Reviewed tag artifact preparation
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'c-a-t-f-o-o-d/chezcat-browser' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_CHEZCAT_RELEASES == 'true'
    environment: release
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CHEZCAT_RELEASE_TAG: ${{ github.ref_name }}
      CHEZCAT_LICENSE_SHA256: ${{ vars.APPROVED_LICENSE_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --no-self-update
      - name: Verify exact tagged source
        run: python tools/verify_offline.py
      - name: Prepare reviewed local artifacts
        shell: pwsh
        run: |
          python tools/build_release_bundle.py --output dist/ChezCat-windows-x64.zip --tag "$env:CHEZCAT_RELEASE_TAG" --approved-license-sha256 "$env:CHEZCAT_LICENSE_SHA256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_release_bundle.py --source --output dist/ChezCat-source.zip --tag "$env:CHEZCAT_RELEASE_TAG" --approved-license-sha256 "$env:CHEZCAT_LICENSE_SHA256"
      - name: Record local identity only
        shell: pwsh
        run: Get-Content dist/*.sha256
      # Intentionally no artifact upload, attestation upload or release step.
      # Those publish on a public repository and require exact-artifact approval.
