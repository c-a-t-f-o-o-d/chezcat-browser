name: Source privacy and configuration
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'security/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    if: github.repository == 'c-a-t-f-o-o-d/chezcat-browser' && github.actor == 'c-a-t-f-o-o-d'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Check snapshot paths, private receipts and package version
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'tools')
          import check_publication as publication
          from check_windows_pe import package_version

          paths = publication.git('ls-tree', '-rz', '--name-only', 'HEAD').decode('utf-8').split('\0')
          publication.check_tree(path for path in paths if path)
          publication.check_receipts('HEAD')
          print('Package version:', package_version()[0])
      - name: Public summary safety controls
        run: python tools/check_public_ci_summary.py
