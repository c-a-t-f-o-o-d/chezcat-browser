name: External intake reports only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports-only:
    if: github.repository == 'c-a-t-f-o-o-d/chezcat-browser' && github.actor == 'c-a-t-f-o-o-d' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Explain the current contribution boundary
        shell: pwsh
        run: |
          @'
          External intake is reports-only. Ordinary issue reports and minimal original bug reproducers follow CONTRIBUTING.md and the published agreement.

          This workflow does not fetch, check out, execute, evaluate or incorporate external substantive submissions. It does not collect assent, signatures or identity records.

          Evaluation requires operationally verified exact-version C2 assent and private records for the immutable submission. Maintained inclusion separately requires the executed assignment and countersigned acceptance for its exact scope. A future reviewed workflow change must implement those controls before code evaluation is enabled.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
